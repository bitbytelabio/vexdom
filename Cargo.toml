# The vexdom Rust workspace (docs/internals/decisions.md ADR-022): `app` is the `vexdom` binary, `crates/` every
# library crate. Spikes are throwaway workspaces of their own.
[workspace]
resolver = "3"
members = ["app", "crates/*"]
# ext-core is built for wasm by `bun run ext-core:build` (boltffi); `cargo test -p ext-core` runs it natively.
default-members = [
    "app",
    "crates/vexdom-client",
    "crates/vexdom-core",
    "crates/vexdom-daemon",
    "crates/vexdom-link",
    "crates/vexdom-pure",
    "crates/vexdom-schema",
    "crates/vexdom-snapshot",
    "crates/vexdom-update",
]
exclude = ["desktop"]

[workspace.package]
version = "0.11.2"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/bitbytelabio/vexdom"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[workspace.dependencies]
# axum 0.8.9 pins tokio-tungstenite 0.29; both are pinned so the control client shares axum's
# tungstenite (ADR-020, docs/research/http-ws-upgrade-proxy.md trap 17).
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }
base64 = "0.23"
capnp = "0.28.2"
capnp-rpc = "0.28.1"
capnpc = "0.28.2"
fancy-regex = "0.20.2"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
futures = "0.3.34"
hmac = "0.13.0"
regex = "1.13"
# No crypto provider of its own: rustls runs on ring, installed by `vexdom_core::install_tls_provider`
# (desktop's gpui already brings ring, so both workspaces build one TLS backend).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
sha2 = "0.11.2"
getrandom = "0.4"
jiff = "1"
libc = "0.2"
nix = { version = "0.32", features = ["signal", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
subtle = "2.6"
url = "2.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "signal", "time", "io-util", "io-std", "sync", "fs"] }
# BoltFFI's CLI is pinned to the same version (CONTRIBUTING.md, CI's BOLTFFI_VERSION).
boltffi = "=0.32.1"
bytes = "1"
similar = "2"
tar = { version = "0.4", default-features = false }
minisign-verify = "0.3"
aes-gcm = "0.11"
psl = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rmcp = { version = "3.12", default-features = false, features = ["server", "transport-io", "local", "elicitation"] }

# The workspace's own crates: every member names them `{ workspace = true }`.
vexdom-client = { path = "crates/vexdom-client" }
vexdom-core = { path = "crates/vexdom-core" }
vexdom-daemon = { path = "crates/vexdom-daemon" }
vexdom-link = { path = "crates/vexdom-link" }
vexdom-pure = { path = "crates/vexdom-pure" }
vexdom-schema = { path = "crates/vexdom-schema" }
vexdom-snapshot = { path = "crates/vexdom-snapshot" }
vexdom-update = { path = "crates/vexdom-update" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.release.package.ext-core]
opt-level = "z"

# PBKDF2 (250k rounds) and capnp run far too slowly unoptimized for the test suite.
[profile.dev.package."*"]
opt-level = 2
