[package]
name = "vexdom-desktop"
version = "0.11.1"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Vexdom's desktop app (P10, ADR-013): the Bridge on and off, browsers, pairing, the agent, notices"

# A workspace of its own, so GPUI never enters the root Cargo.lock (ADR-026). CI builds and tests it on macOS and Linux.
[workspace]

[[bin]]
name = "vexdom-desktop"
path = "src/main.rs"

[dependencies]
capnp = "0.28.2"
gpui = "0.2.2"
# Already in GPUI's tree; decodes the menu-bar template.
image = { version = "0.25", default-features = false, features = ["png"] }
notify-rust = "4"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt", "macros", "time", "process", "sync"] }
unicode-segmentation = "1"
vexdom-client = { path = "../crates/vexdom-client" }
# State paths, the log, config's theme list.
vexdom-core = { path = "../crates/vexdom-core" }
vexdom-schema = { path = "../crates/vexdom-schema" }
# Checks for, verifies and stages a new Vexdom.app (ADR-031); brings reqwest.
vexdom-update = { path = "../crates/vexdom-update" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSData", "NSError", "NSString"] }
# "Open at login" (`SMAppService.mainAppService`).
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
tray-icon = "0.27"

# Linux builds only for CI (the app ships for macOS): the tray over D-Bus (StatusNotifierItem),
# so there is no GTK to build against.
[target.'cfg(not(target_os = "macos"))'.dependencies]
# Held, not used: gpui 0.2.2 → zed-async-tar → xattr 0.2.3 reads `libc::ENOATTR`, which libc
# 0.2.190 removed on Linux. Drop this once gpui no longer brings xattr 0.2.
libc = "=0.2.189"
tray-icon = { version = "0.27", default-features = false, features = ["ksni"] }
