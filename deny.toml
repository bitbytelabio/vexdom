# cargo-deny policy for both Cargo workspaces: the root (the Bridge) and desktop/ (CI runs
# `cargo deny check` on each, .github/workflows/ci.yml job `deny`).

[advisories]
yanked = "deny"

[licenses]
# Exactly the licenses the two lockfiles use. GPL-2.0-only (self_cell) and LGPL-2.1-or-later
# (r-efi) appear only as alternatives in OR expressions those crates also offer under MIT or
# Apache-2.0, so they are not allowed here. A new license is a decision, not a drive-by edit.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
# One TLS backend: rustls on ring (desktop's gpui forces ring; the root follows).
deny = [{ crate = "aws-lc-rs" }, { crate = "aws-lc-sys" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
